<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calligraphy Guide Sheet Generator</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@500&display=swap" rel="stylesheet">
</head>
<body>
<div class="app">

<!--   <header class="app-header">
    <h1>Calligraphy Guide Sheet Generator</h1>
    <p>Build a custom practice sheet — optionally trace over a photo of your own writing — then download a print-ready PDF.</p>
  </header>
-->
  <div class="app-body">

    <aside class="controls" id="controls">

      <section class="panel">
        <h2>Step 1: Page Setup</h2>
        <div class="field">
          <label for="paperSize">Paper size</label>
          <select id="paperSize">
            <option value="letter">Letter (8.5 × 11 in)</option>
            <option value="a4" selected>A4 (210 × 297 mm)</option>
            <option value="legal">Legal (8.5 × 14 in)</option>
          </select>
        </div>
        <div class="field">
          <label for="orientation">Orientation</label>
          <select id="orientation">
            <option value="portrait" selected>Portrait</option>
            <option value="landscape">Landscape</option>
          </select>
        </div>
        <div class="field row">
          <div>
            <label for="marginLR">Side margin (mm)</label>
            <input type="number" id="marginLR" min="0" max="40" value="15">
          </div>
          <div>
            <label for="marginTB">Top/bottom margin (mm)</label>
            <input type="number" id="marginTB" min="0" max="40" value="15">
          </div>
        </div>
        <div class="field">
          <label for="pageCount">Number of pages</label>
          <input type="number" id="pageCount" min="1" max="30" value="1">
        </div>
      </section>

      <section class="panel">
        <h2>Step 2: Upload Photo Of Your Lettering (Optional)</h2>
        <p class="hint">Image can be dragged to be repositioned</p>
        <div class="field toggle-row">
          <label class="switch">
            <input type="checkbox" id="showPhoto">
            <span class="slider"></span>
          </label>
          <span>Use photo as background</span>
        </div>
        <div class="field">
          <label for="photoInput" class="file-label">Choose image…</label>
          <input type="file" id="photoInput" accept="image/*">
        </div>
        <div class="field">
          <label for="photoOpacity">Photo opacity (%)</label>
          <div class="slider-with-number">
            <input type="range" id="photoOpacity" min="5" max="100" value="60">
            <input type="number" id="photoOpacityNum" min="5" max="100" value="60">
          </div>
        </div>
        <div class="field">
          <label for="photoScale">Photo scale (0 = original size)</label>
          <div class="slider-with-number">
            <input type="range" id="photoScale" min="-10" max="10" value="0">
            <input type="number" id="photoScaleNum" min="-10" max="10" value="0">
          </div>
        </div>
        <div class="field">
          <label for="photoRotation">Photo rotation (°)</label>
          <div class="slider-with-number">
            <input type="range" id="photoRotation" min="0" max="360" value="0">
            <input type="number" id="photoRotationNum" min="0" max="360" value="0">
          </div>
        </div>
        <button class="btn secondary" id="fitPhotoBtn" type="button">Fit &amp; Center Photo</button>

      </section>

      <section class="panel">
        <h2>Step 3: Guide Lines</h2>
        <div class="field">
          <label for="preset">Quick preset</label>
          <select id="preset">
            <option value="custom">Custom</option>
            <option value="broadedge" selected>Broad-edge / Italic (4-line)</option>
            <option value="copperplate">Copperplate / Pointed Pen</option>
            <option value="simple">Simple ruled (baseline only)</option>
          </select>
        </div>
        <div class="field">
          <label for="unitHeight">Repeat every (mm, baseline to baseline)</label>
          <input type="number" id="unitHeight" min="5" max="80" value="24" step="0.5">
        </div>

        <div class="field">
          <label>Line Set</label>
          <p class="hint">Use negative numbers for below baseline.</p>
          <div class="lines-table-head">
            <span>Name</span>
            <span>Height (mm)</span>
            <span>Style</span>
            <span>Colour</span>
            <span>Pt</span>
            <span></span>
          </div>
          <div id="linesList"></div>
          <button class="btn secondary" id="addLineBtn" type="button">+ Add line</button>

        </div>
      </section>

      <section class="panel">
        <h2>Step 4: Slant Guides (Optional)</h2>
        <div class="field checks">
          <label><input type="checkbox" id="showSlant"> Show slant guide lines</label>
        </div>
        <div class="field row">
          <div>
            <label for="slantAngle">Angle (° from baseline)</label>
            <input type="range" id="slantAngle" min="15" max="90" value="55">
            <output id="slantAngleOut">55°</output>
          </div>
          <div>
            <label for="slantSpacing">Spacing (mm)</label>
            <input type="number" id="slantSpacing" min="3" max="40" value="12" step="0.5">
          </div>
        </div>
        <div class="field row">
          <div>
            <label for="slantStyle">Slant line style</label>
            <select id="slantStyle">
              <option value="solid">Solid</option>
              <option value="dashed" selected>Dashed</option>
            </select>
          </div>
          <div>
            <label for="slantColor">Slant line colour</label>
            <input type="color" id="slantColor" value="#9aa3af">
          </div>
        </div>
        <div class="field">
          <label for="slantThickness">Slant line thickness (pt)</label>
          <input type="number" id="slantThickness" min="0.25" max="10" step="0.25" value="1">
        </div>
      </section>

      <button class="btn primary" id="downloadBtn" type="button">Download PDF</button>
    </aside>

    <main class="preview-wrap">
      <div class="preview-toolbar">
        <span id="pageInfo">Preview</span>
      </div>
      <div class="canvas-shell">
        <canvas id="sheetCanvas"></canvas>
      </div>
    </main>

  </div>

  <footer class="app-footer">
    <p> </p>
  </footer>
</div>

<template id="lineRowTemplate">
  <div class="line-row">
    <input type="text" class="line-name" maxlength="30">
    <input type="number" class="line-offset" step="0.5">
    <select class="line-style">
      <option value="solid">Solid</option>
      <option value="dashed">Dashed</option>
    </select>
    <input type="color" class="line-color">
    <input type="number" class="line-thickness" min="0.25" max="10" step="0.25">
    <button type="button" class="line-delete" title="Delete line">✕</button>
  </div>
</template>

<script src="vendor-jspdf.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
